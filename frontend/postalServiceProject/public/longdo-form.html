<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Longdo Address Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://api.longdo.com/map/?key=fortestonlydonotuseinproduction!"></script>
    <script src="https://api.longdo.com/address-form/js/addressform.js"></script>
    <style>
      body {
        font-family: "Prompt", "Arial", sans-serif;
        background: transparent;
        margin: 0;
        padding: 0;
        height: 100%;
      }

       ::-webkit-scrollbar {
        display: none;
      }
      html {
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE, Edge */
      }

      .form-container {
        width: 100%;
        height: 100vh;
        padding: 0.5rem 0;
        background: transparent;
        height: 100%;
      }

      h2 {
        color: #e14434;
        margin-bottom: 0.8rem;
        font-weight: bold;
        font-size: 1.4rem;
      }

      #form_div {
        background: transparent;
        border: none;
        padding: 0;
        color: #333;
      }

      button {
        background-color: #9FC87E;
        color: #075B5E;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 1rem;
        margin-right: 0.5rem;
        transition: all 0.2s ease;
      }

      button:hover {
        background-color: #e14434;
        transform: scale(1.05);
      }

      .btn-reset {
        background-color: #FF3F33;
        color: #333;
      }

      .btn-reset:hover {
        background-color: #F2B28C;
        color: #FF3F33;
      }

      /* เพิ่มความสวยของ input ภายใน longdo form */
      input,
      select {
         width: 100% !important;
        padding: 8px !important;
        margin-bottom: 10px !important;
        border-radius: 8px !important;
        border: 1px solid #ddd !important;
        background: #fffef9 !important;
        font-size: 14px !important;
        transition: border 0.2s ease;
      }

      input:focus,
      select:focus {
        border-color: #5eabd6 !important;
        outline: none !important;
      }
      label {
        font-size: 0.9rem;
        color: #444;
      }
      .button-group {
        display: flex;
        gap: 8px;
        margin-top: 0.5rem;
      }

    </style>

    <script>
      var myform;

      function init() {
        myform = new longdo.AddressForm("form_div", {
          showLabels: false,
        });
      }

      function submitForm() {
        if (!myform) return;
        const data = myform.getFormJSON();
        window.parent.postMessage({ type: "LONGDO_ADDRESS", data }, "*");
      }

      function resetForm() {
        if (myform) myform.resetForm();
      }
    </script>
  </head>

  <body onload="init()">
    <div class="form-container">
      <h2>กรอกที่อยู่จัดส่ง</h2>
      <div id="form_div">Loading...</div>

      <div style="margin-top: 1rem">
        <button onclick="submitForm()"><i class="bi bi-check-square"></i> บันทึกข้อมูล</button>
        <button class="btn-reset" onclick="resetForm()"> <i class="bi bi-x-square-fill"></i>ล้างข้อมูล</button>
      </div>
    </div>
  </body>
  </body>
</html>
